name: Feature request
description: Suggest an improvement or a new feature
title: "[Feature]: "
labels:
  - "type:feature"
  - "status:needs-review"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the change in plain words. Examples of how you would use it help a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you do today instead?
      description: Optional. Any workaround you use now.
